name: CI

on:
  pull_request:
    branches: [ development ]
  push:
    branches: [ 'feature/**' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Generate settings.xml
        run: |
          cat > settings.xml << 'XMLEOF'
          <settings>
            <servers>
              <server>
                <id>event</id>
                <username>${env.MAVEN_CI_USERNAME}</username>
                <password>${env.MAVEN_PACKAGES_TOKEN}</password>
              </server>
              <server>
                <id>cork</id>
                <username>${env.MAVEN_CI_USERNAME}</username>
                <password>${env.MAVEN_PACKAGES_TOKEN}</password>
              </server>
              <server>
                <id>platori</id>
                <username>${env.MAVEN_CI_USERNAME}</username>
                <password>${env.MAVEN_PACKAGES_TOKEN}</password>
              </server>
              <server>
                <id>parent</id>
                <username>${env.MAVEN_CI_USERNAME}</username>
                <password>${env.MAVEN_PACKAGES_TOKEN}</password>
              </server>
            </servers>
          </settings>
          XMLEOF
      - name: Compile
        run: mvn --batch-mode --settings settings.xml compile -Dcheckstyle.skip=true
        env:
          MAVEN_CI_USERNAME: ci-packages
          MAVEN_PACKAGES_TOKEN: ${{ secrets.MAVEN_PACKAGES_TOKEN }}

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Generate settings.xml
        run: |
          cat > settings.xml << 'XMLEOF'
          <settings>
            <servers>
              <server>
                <id>event</id>
                <username>${env.MAVEN_CI_USERNAME}</username>
                <password>${env.MAVEN_PACKAGES_TOKEN}</password>
              </server>
              <server>
                <id>cork</id>
                <username>${env.MAVEN_CI_USERNAME}</username>
                <password>${env.MAVEN_PACKAGES_TOKEN}</password>
              </server>
              <server>
                <id>platori</id>
                <username>${env.MAVEN_CI_USERNAME}</username>
                <password>${env.MAVEN_PACKAGES_TOKEN}</password>
              </server>
              <server>
                <id>parent</id>
                <username>${env.MAVEN_CI_USERNAME}</username>
                <password>${env.MAVEN_PACKAGES_TOKEN}</password>
              </server>
            </servers>
          </settings>
          XMLEOF
      - name: Test
        run: mvn --batch-mode --settings settings.xml test -Dcheckstyle.skip=true
        env:
          MAVEN_CI_USERNAME: ci-packages
          MAVEN_PACKAGES_TOKEN: ${{ secrets.MAVEN_PACKAGES_TOKEN }}
